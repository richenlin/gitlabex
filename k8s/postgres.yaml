---
# PostgreSQL PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: gitlabex
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  # storageClassName: local-path  # 根据集群实际存储类调整

---
# PostgreSQL ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: gitlabex
data:
  init-postgres.sql: |
    -- PostgreSQL 初始化脚本
    -- 为GitLabEx应用创建额外的数据库和用户
    
    -- 创建gitlabex数据库
    CREATE DATABASE gitlabex;
    
    -- 创建gitlabex用户（使用与Secret中相同的密码）
    -- 注意：这里使用占位符，实际密码通过环境变量或Secret管理
    -- 如果需要独立的gitlabex用户，取消下面的注释并修改密码
    -- CREATE USER gitlabex WITH ENCRYPTED PASSWORD 'your-password-here';
    -- GRANT ALL PRIVILEGES ON DATABASE gitlabex TO gitlabex;
    
    -- 方案1：使用gitlab用户访问gitlabex数据库（推荐，简化权限管理）
    GRANT ALL PRIVILEGES ON DATABASE gitlabex TO gitlab;
    
    -- 切换到gitlabex数据库进行进一步配置
    \c gitlabex;
    
    -- 授予gitlab用户schema权限
    GRANT ALL ON SCHEMA public TO gitlab;
    
    -- 授予现有表和序列的权限
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO gitlab;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO gitlab;
    
    -- 授予将来创建的表和序列的默认权限（重要！）
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO gitlab;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO gitlab;
    
    -- 确保gitlab用户可以在public schema中创建对象
    GRANT CREATE ON SCHEMA public TO gitlab;
    
    -- 方案2：如果使用独立的gitlabex用户，取消下面的注释
    -- \c gitlabex;
    -- GRANT ALL ON SCHEMA public TO gitlabex;
    -- GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO gitlabex;
    -- GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO gitlabex;
    -- ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO gitlabex;
    -- ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO gitlabex;
    -- GRANT CREATE ON SCHEMA public TO gitlabex;

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: gitlabex
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: gitlabex-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitlabex-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: "gitlab"
        - name: POSTGRES_MULTIPLE_DATABASES
          value: "gitlabex"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - gitlab
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - gitlab
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-script
        configMap:
          name: postgres-init-script

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: gitlabex-postgres
  namespace: gitlabex
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: postgres
