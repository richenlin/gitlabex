# GitLabEx 开发环境配置文件
# 覆盖基础配置中的开发环境特定设置

# 服务器配置
server:
  environment: "development"
  debug: true

# 数据库配置
database:
  host: "localhost"

# Redis配置
redis:
  host: "localhost"

# GitLab配置
gitlab:
  url: "http://192.168.1.10:8081"

# MinIO配置
minio:
  endpoint: "localhost:9000"

# 日志配置
logging:
  level: "debug"

# 安全配置
security:
  cors_allowed_origins: "http://localhost:3000,http://localhost:8081,http://127.0.0.1:3000,http://0.0.0.0:3000"
