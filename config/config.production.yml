# GitLabEx 生产环境配置文件
# 覆盖基础配置中的生产环境特定设置
# 支持通过环境变量动态配置网络地址

# 服务器配置
server:
  environment: "production"
  debug: false

# 数据库配置
database:
  host: "postgres"

# Redis配置
redis:
  host: "redis"

# GitLab配置
gitlab:
  url: "http://gitlab"
  # 重定向URI将通过环境变量配置，支持跨服务器部署
  redirect_uri: "http://localhost:3000/auth/gitlab/callback"

# MinIO配置
minio:
  endpoint: "minio:9000"

# 应用配置
app:
  frontend_url: "http://localhost:3000"
  allowed_origins: "http://localhost:3000"

# 日志配置
logging:
  level: "info"
  format: "json"

# 安全配置
security:
  cors_allowed_origins: "http://localhost:3000,http://127.0.0.1:3000,http://0.0.0.0:3000"
