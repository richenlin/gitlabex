# GitLabEx 开发环境配置文件
# 开发环境配置，用于本地开发和测试
# 敏感信息通过环境变量加载

# 服务器配置
server:
  host: "0.0.0.0"
  port: "8080"
  environment: "development"
  debug: true

# 数据库配置 - 使用IP地址
database:
  host: "192.168.0.46"
  port: "5432"
  user: "gitlabex"
  password: "password123"  # 生产环境应通过环境变量设置
  name: "gitlabex"
  ssl_mode: "disable"
  timezone: "Asia/Shanghai"

# Redis配置 - 使用IP地址
redis:
  host: "192.168.0.46"
  port: "6379"
  password: "password123"  # 生产环境应通过环境变量设置
  db: 0

# GitLab配置 - 使用IP地址
gitlab:
  url: "http://192.168.0.46:8081"
  client_id: "537d8206b73fa931da99061f1564e97da72aa53fcd6eb3587d8f23b14ee6088e"  # 必须通过环境变量设置
  client_secret: "7e48942204e3783d39dacd8f440b8444e6bd1f9687772ef10c615775eb33210a"  # 必须通过环境变量设置
  redirect_uri: "http://192.168.0.46:3000/auth/gitlab/callback"
  scopes: "api read_api openid"
  system_token: "glpat-gcWAqg7EsbgaRPnKzVHb"  # 必须通过环境变量设置

# JWT配置
jwt:
  secret: "gitlabex_jwt_secret_development_environment_2024_very_secure_key_32_chars_minimum"
  expiration_hours: 24

# MinIO对象存储配置 - 使用IP地址
minio:
  endpoint: "192.168.0.46:9000"
  access_key: "admin"
  secret_key: "password123"  # 生产环境应通过环境变量设置
  use_ssl: false
  region: "us-east-1"

# 日志配置
logging:
  level: "info"
  format: "json"

# 文件上传配置
upload:
  allowed_file_types: "pdf,doc,docx,ppt,pptx,xls,xlsx,csv,txt,md,zip,rar,png,jpg,jpeg,gif"
  max_size: "100MB"
  path: "/app/uploads"

# 安全配置
security:
  cors_allowed_origins: "http://192.168.0.46:3000,http://localhost:3000,http://127.0.0.1:3000"
  cors_allowed_methods: "GET,POST,PUT,DELETE,OPTIONS"
  cors_allowed_headers: "Content-Type,Authorization,X-Requested-With,X-API-Key"
  cors_allow_credentials: true
  rate_limit_rpm: 300
  rate_limit_burst: 50

# API密钥配置
api_keys:
  third_party_api_key: "gitlabex_third_party_api_key_2024_change_in_production_32_chars_minimum"
