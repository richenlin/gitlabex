# GitLabEx 开发环境配置文件
# 开发环境配置，用于本地开发和测试
# 敏感信息通过环境变量加载

# 服务器配置
server:
  host: "0.0.0.0"
  port: "8080"
  environment: "development"
  debug: true

# 数据库配置 - 使用IP地址
database:
  host: "192.168.170.172"
  port: "5432"
  user: "gitlabex"
  password: "password123"  # 生产环境应通过环境变量设置
  name: "gitlabex"
  ssl_mode: "disable"
  timezone: "Asia/Shanghai"

# Redis配置 - 使用IP地址
redis:
  host: "192.168.170.172"
  port: "6379"
  password: "password123"  # 生产环境应通过环境变量设置
  db: 0

# GitLab配置 - 使用IP地址
gitlab:
  # 获取方式: 访问 http://localhost:8081/admin/applications
  # 权限范围: api read_api openid
  url: "http://192.168.170.172:8081"
  client_id: "1c9c6837aecdff1ad3272a8bb8f830057af34f19194d6bac161967525f90349f"  # 必须通过环境变量设置
  client_secret: "6edf947ba0626ce96dc409d32b83faeb363b85e1f0186a7fc4493174b749693f"  # 必须通过环境变量设置
  redirect_uri: "http://192.168.170.172:3000/auth/gitlab/callback"
  scopes: "api read_api openid"
  # GitLab 个人访问令牌 (用于数据初始化已经游客访问部分公开数据)
  # 获取方式: 访问 http://localhost:8081/-/profile/personal_access_tokens
  # 权限范围: api, read_api, read_user, read_repository, write_repository
  system_token: "glpat-3mo3mCy2hAcsM2g9GJKH"  # 必须通过环境变量设置

# JWT配置
jwt:
  secret: "+3ZETPDjlCHOHfwyvp+UXkg5uhuuFfhfTRJR5gLqxpM="
  expiration_hours: 24

# MinIO对象存储配置 - 使用IP地址
minio:
  endpoint: "192.168.170.172:9000"
  access_key: "admin"
  secret_key: "password123"  # 生产环境应通过环境变量设置
  use_ssl: false
  region: "us-east-1"

# 日志配置
logging:
  level: "info"
  format: "json"

# 文件上传配置
upload:
  allowed_file_types: "pdf,doc,docx,ppt,pptx,xls,xlsx,csv,txt,md,zip,rar,png,jpg,jpeg,gif"
  max_size: "100MB"
  path: "/app/uploads"

# 安全配置
security:
  cors_allowed_origins: "http://localhost:3000,http://127.0.0.1:3000,http://192.168.170.172:3000"
  cors_allowed_methods: "GET,POST,PUT,DELETE,OPTIONS"
  cors_allowed_headers: "Content-Type,Authorization,X-Requested-With,X-API-Key"
  cors_allow_credentials: true
  rate_limit_rpm: 300
  rate_limit_burst: 50

# API密钥配置
api_keys:
  third_party_api_key: "w0-ko3z6FbUW_dL6ZxHze0I85BOWXz_c"
