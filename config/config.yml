# GitLabEx 开发环境配置文件
# 开发环境配置，用于本地开发和测试
# 敏感信息通过环境变量加载

# 服务器配置
server:
  host: "0.0.0.0"
  port: "8080"
  environment: "development"
  debug: true

# 数据库配置 - 使用IP地址
database:
  host: "localhost"
  port: "5432"
  user: "gitlabex"
  password: "password123"  # 生产环境应通过环境变量设置
  name: "gitlabex"
  ssl_mode: "disable"
  timezone: "Asia/Shanghai"

# Redis配置 - 使用IP地址
redis:
  host: "localhost"
  port: "6379"
  password: "password123"  # 生产环境应通过环境变量设置
  db: 0

# GitLab配置 - 使用IP地址
gitlab:
  # 获取方式: 访问 http://localhost:8081/admin/applications
  # 权限范围: api read_api openid
  url: "http://localhost:8081"
  client_id: "f8072770bb4c440075025a39b81a8a8bb722003fe35665afd6929d666d09a30d"  # 必须通过环境变量设置
  client_secret: "38406f2d90986bd48788bc56798e86991426560d3787fde91868344c75fb1c4f"  # 必须通过环境变量设置
  redirect_uri: "http://localhost:3000/auth/gitlab/callback"
  scopes: "api read_api openid"
  # GitLab 个人访问令牌 (用于数据初始化已经游客访问部分公开数据)
  # 获取方式: 访问 http://localhost:8081/-/profile/personal_access_tokens
  # 权限范围: api, read_api, read_user, read_repository, write_repository
  system_token: "glpat-94sK8J9yi1z-V6BsytZ8"  # 必须通过环境变量设置

# JWT配置
jwt:
  secret: "U0YownNcZpy84ejaTqutY96zoLhjk4txDQRa7i6Yjc4="
  expiration_hours: 24

# MinIO对象存储配置 - 使用IP地址
minio:
  endpoint: "localhost:9000"
  access_key: "admin"
  secret_key: "password123"  # 生产环境应通过环境变量设置
  use_ssl: false
  region: "us-east-1"

# 日志配置
logging:
  level: "info"
  format: "json"

# 文件上传配置
upload:
  allowed_file_types: "pdf,doc,docx,ppt,pptx,xls,xlsx,csv,txt,md,zip,rar,png,jpg,jpeg,gif"
  max_size: "100MB"
  path: "/app/uploads"

# 安全配置
security:
  cors_allowed_origins: "http://localhost:3000,http://localhost:3000,http://127.0.0.1:3000"
  cors_allowed_methods: "GET,POST,PUT,DELETE,OPTIONS"
  cors_allowed_headers: "Content-Type,Authorization,X-Requested-With,X-API-Key"
  cors_allow_credentials: true
  rate_limit_rpm: 300
  rate_limit_burst: 50

# API密钥配置
api_keys:
  third_party_api_key: "32ohJjokJGN0axDVyR7v_w206rSjPqdK"
